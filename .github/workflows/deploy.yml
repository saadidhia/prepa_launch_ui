name: CI

on:
  push:
    branches:
      - master
      - qa
      - prod   # أضفنا prod

jobs:
  build:
    runs-on: ubuntu-latest
    env: 
     CI: false # Set CI environment variable to false

    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    
    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: 18  
    
    - name: Install dependencies
      run: |
        npm install
        npm install -g env-cmd
    
    - name: Build frontend
      run: npm run build-qa

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: build   

  deploy_qa:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/qa'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1
      
    - name: Login to Docker Hub
      run: docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build Docker image
      run: |
        docker build -t prepalaunch/prepa_launch:qa_ui_latest .
        docker push prepalaunch/prepa_launch:qa_ui_latest

  deploy_prod:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/prod'
    
    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: frontend-build
        path: build   # يرجع يعمل download للـ build folder هنا

    - name: Start ssh-agent
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.HETZNER_BUSINESS_SERVER }}

    - name: Deploy frontend to Hetzner
      run: |
       echo "🚀 Deploying frontend to Hetzner..."
       ssh -o StrictHostKeyChecking=no root@91.98.119.218 "mkdir -p /opt/prepa/frontend && rm -rf /opt/prepa/frontend/*"
       scp -r build/* root@91.98.119.218:/opt/prepa/frontend/
       ssh root@91.98.119.218 "cp -r /opt/prepa/frontend/* /var/www/prepa/"   # ⬅️ this is the line I added
       ssh root@91.98.119.218 "ls -lh /opt/prepa/frontend"
       ssh root@91.98.119.218 "systemctl reload nginx || true"
       echo "✅ Frontend deployed successfully!"
