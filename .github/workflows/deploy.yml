name: CI

on:
  push:
    branches:
      - master
      - qa

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CI: false  # Set CI environment variable to false

    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    
    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: 18  
    
    - name: Install dependencies
      run: |
        npm install
        npm install -g env-cmd
    
    - name: Build
      run: npm run build-dev

  deploy_qa:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/qa'  # Only runs on the qa branch
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1
      
    - name: Login to Docker Hub
      run:  docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
     
    - name: Build Docker image
      run: |
        docker build -t prepalaunch/prepa_launch:qa_ui_latest .
        docker push prepalaunch/prepa_launch:qa_ui_latest
