name: CI

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CI: false  # Set CI environment variable to false

    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    
    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: 18  
    
    - name: Install dependencies
      run: |
        npm install
        npm install -g env-cmd
    
    - name: Build
      run: npm run build-dev
